name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: ci
        python-version: '3.10'
        auto-activate-base: false
    - name: Install dependencies
      run: |
        conda install -n ci -y -c conda-forge pip
        if [ -f environment.yml ]; then
          conda env update --name ci --file environment.yml --prune
        elif [ -f requirements.txt ]; then
          conda run -n ci python -m pip install -r requirements.txt
        fi
    - name: Lint with flake8
      run: |
        conda install -n ci -y -c conda-forge flake8
        # stop the build if there are Python syntax errors or undefined names
        conda run -n ci flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        conda run -n ci flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        conda install -n ci -y -c conda-forge pytest
        conda run -n ci pytest
